name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - 'ci/**'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify with Maven
        run: ./mvnw clean package verify

      - name: Copy JAR to root for Docker
        run: cp target/*.jar .

      - name: Build and push Docker image
        run: |
          docker login ghcr.io -u mgy91 -p ${{ secrets.GITHUB_TOKEN }}
          docker build . -t ghcr.io/mgy91/cubix/1/optional/app:springboot
          docker push ghcr.io/mgy91/cubix/1/optional/app:springboot
