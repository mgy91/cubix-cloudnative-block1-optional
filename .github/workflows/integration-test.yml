name: Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'ci/**'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: ./mvnw clean integration-test
